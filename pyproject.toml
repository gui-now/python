[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guinew"
version = "1.0.0"
description = "Python SDK + agent tools for gui.new — instant shareable HTML canvases"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["gui-new", "html", "canvas", "sharing", "langchain", "llamaindex", "crewai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0", "pydantic>=2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
crewai = ["crewai>=0.1.0", "pydantic>=2.0"]
all = ["langchain-core>=0.1.0", "llama-index-core>=0.10.0", "crewai>=0.1.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://gui.new"
Repository = "https://github.com/stratuslabs/guinew-python"

[tool.setuptools.packages.find]
where = ["src"]
